
# == GENERAL ===================================================
[terminal.shell]
program = "/usr/bin/zsh"

[font]
size = 12

[font.normal]
family = "JetBrainsMono Nerd Font"

# == OBJECTS ===================================================
[cursor]
blink_interval = 550
thickness = 0.15

[cursor.style]
blinking = "On"
shape = "Block"

[window]
decorations = "none"
# opacity = 1
# opacity = 0.85

[window.padding]
x = 15
y = 15

[scrolling]
history = 5000
multiplier = 3

[bell]
animation = "Linear"
duration = 0
command = { program = "paplay", args = ["/usr/share/sounds/freedesktop/stereo/dialog-error.oga"] }

[general]

live_config_reload = true

# == COLORS ===================================================
# Default colors
[colors.primary]
background = "#000000"
foreground = "#afb1db"

# Cursor colors
[colors.cursor]
cursor = "#8656e3"
text = "#000000"

# Normal colors
[colors.normal]
black = "#353c52"
red = "#e7034a"
green = "#61b33e"
yellow = "#ffb964"
blue = "#5884d4"
magenta = "#7a44e3"
cyan = "#7df0f0"
white = "#faf7ff"

# Bright colors
[colors.bright]
black = "#353c52"
red = "#e71c5b"
green = "#6fb352"
yellow = "#ffb964"
blue = "#5f90ea"
magenta = "#8656e3"
cyan = "#97f0f0"
white = "#fdfcff"
