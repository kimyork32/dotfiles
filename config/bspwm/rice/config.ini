# config.ini

[global/wm]

margin-bottom = 0
margin-top = 0

include-file = modules.ini
include-file = ../src/system.ini

[color]
grisb = #353c52
fg = #afb1db
black = #000000
blackg = #4f506e
green = #61b33e

[bar/dark]
monitor = ${env:MONITOR:}
monitor-strict = false
override-redirect = false

bottom = false
fixed-center = true

width = 100%
height = 17

offset-x = 0%
offset-y = 0

background = ${color.black}
foreground = ${color.fg}

padding = 0

module-margin-left = 0
module-margin-right = 0

font-0 = "JetBrainsMono:style=Bold:size=8;2"
font-1 = "Font Awesome 6 Free Solid:size=8;2"
font-2 = "Material Design Icons Desktop:size=10;3"

modules-left = bspwm
modules-right = pulseaudio sep2 network sep2 date sep2 battery

dim-value = 1.0

wm-restack = bspwm
enable-ipc = true

cursor-click = pointer
cursor-scroll =

[settings]
screenchange-reload = false
compositing-background = source
compositing-overline = over
compositing-underline = over
compositing-border = over

pseudo-transparency = false
